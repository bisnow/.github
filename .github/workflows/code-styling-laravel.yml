name: Code Styling
on:
  workflow_call:
    inputs:
      php:
        description: 'PHP version'
        required: false
        type: string
        default: '8.4'
      php_extensions:
        description: 'Comma-separated PHP extensions to require (e.g. "pdo_sqlite, gd")'
        required: false
        type: string
        default: ''
      runs_on:
        description: 'Runner label(s) for the job (e.g. a self-hosted ARC scale set). Defaults to GitHub-hosted ubuntu-latest.'
        required: false
        type: string
        default: 'ubuntu-latest'
    secrets:
      COMPOSER_OAUTH_GITHUB_ACTIONS:
        required: true
      FLUX_USERNAME:
        required: false
      FLUX_PASSWORD:
        required: false

jobs:
  pint:
    name: Pint & Rector
    runs-on: ${{ inputs.runs_on }}
    permissions:
      contents: write
    steps:
      - name: Check out code
        uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}

      - name: Set up PHP & install dependencies
        uses: bisnow/.github/.github/actions/setup-php-composer@main
        with:
          php-version: ${{ inputs.php || '8.4' }}
          extensions: ${{ inputs.php_extensions }}
          coverage: none
          composer-oauth-token: ${{ secrets.COMPOSER_OAUTH_GITHUB_ACTIONS }}
          flux-username: ${{ secrets.FLUX_USERNAME }}
          flux-password: ${{ secrets.FLUX_PASSWORD }}
          composer-install-flags: '--no-scripts'

      - name: Run Laravel Rector
        run: composer rector

      - name: Commit changes
        id: auto_commit_rector_action
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "[skip actions] Apply rector fixes"
          commit_user_name: GitHub Action
          commit_user_email: actions@github.com

      - name: Run Laravel Pint
        run: composer cs-fix

      - name: Commit changes
        id: auto_commit_action
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "[skip actions] Apply style fixes"
          commit_user_name: GitHub Action
          commit_user_email: actions@github.com
