name: Code Styling
on:
  workflow_call:
    inputs:
      php:
        description: 'PHP version'
        required: false
        type: string
        default: '8.4'
      runs_on:
        description: 'Runner label(s) for the job (e.g. a self-hosted ARC scale set). Defaults to GitHub-hosted ubuntu-latest.'
        required: false
        type: string
        default: 'ubuntu-latest'
    secrets:
      COMPOSER_OAUTH_GITHUB_ACTIONS:
        required: true
      FLUX_USERNAME:
        required: false
      FLUX_PASSWORD:
        required: false

jobs:
  pint:
    name: Pint & Rector
    runs-on: ${{ inputs.runs_on }}
    permissions:
      contents: write
    steps:
      - name: Check out code
        uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref }}

      # Prefer the baked PHP (Pint/Rector only need php + composer, both baked);
      # fall back to setup-php if the requested version isn't in the image.
      - name: Check for usable baked PHP
        id: php-check
        shell: bash
        run: |
          set -uo pipefail
          want='${{ inputs.php || '8.4' }}'
          bin="/usr/bin/php${want}"
          if [ -x "$bin" ] && command -v composer >/dev/null 2>&1; then
            mkdir -p "$HOME/.local/bin"
            ln -sf "$bin" "$HOME/.local/bin/php"
            echo "$HOME/.local/bin" >> "$GITHUB_PATH"
            echo "use_system=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Using baked PHP ${want} ($("$bin" -v | head -1))"
          else
            echo "use_system=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Falling back to shivammathur/setup-php (php${want} or composer not baked)"
          fi

      - name: Set up PHP (setup-php fallback)
        if: steps.php-check.outputs.use_system != 'true'
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ inputs.php || '8.4' }}
          tools: composer

      - name: Install dependencies
        run: |
          composer config github-oauth.github.com ${{ secrets.COMPOSER_OAUTH_GITHUB_ACTIONS }}
          if [ -n "${{ secrets.FLUX_USERNAME }}" ]; then
            composer config http-basic.composer.fluxui.dev "${{ secrets.FLUX_USERNAME }}" "${{ secrets.FLUX_PASSWORD }}"
          fi
          composer install --no-scripts --no-progress

      - name: Run Laravel Rector
        run: composer rector

      - name: Commit changes
        id: auto_commit_rector_action
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "[skip actions] Apply rector fixes"
          commit_user_name: GitHub Action
          commit_user_email: actions@github.com

      - name: Run Laravel Pint
        run: composer cs-fix

      - name: Commit changes
        id: auto_commit_action
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "[skip actions] Apply style fixes"
          commit_user_name: GitHub Action
          commit_user_email: actions@github.com
