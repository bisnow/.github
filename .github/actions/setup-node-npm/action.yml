name: Set up Node and npm
description: Set up Node.js, cache dependencies, install, and build

inputs:
  build-script:
    description: npm script to run for build (e.g. "build", "prod")
    required: false
    default: ''
  node-version-file:
    description: Path to node version file
    required: false
    default: '.nvmrc'

runs:
  using: composite
  steps:
    # Prefer the Node baked into the runner image when the requested major is
    # available, skipping actions/setup-node (which downloads Node each job).
    # The runner image bakes several majors side by side under
    # /usr/local/lib/nodejs/<major>/bin; if the requested major is baked there we
    # prepend it to PATH so later steps' `node`/`npm` resolve to it. Otherwise we
    # accept the default `node` on PATH when its major matches (older images that
    # baked a single version). npm uses the shared FSx cache via npm_config_cache.
    # Falls back to actions/setup-node on any mismatch, so it's safe for every repo.
    - name: Check for usable baked Node
      id: node-check
      shell: bash
      run: |
        set -uo pipefail
        vf='${{ inputs.node-version-file }}'
        want=""
        [ -f "$vf" ] && want=$(tr -d ' \t\r' < "$vf" | sed -E 's/^v//; s/\..*$//' | head -1)
        baked_bin="/usr/local/lib/nodejs/${want}/bin"
        if [ -n "$want" ] && [ -x "$baked_bin/node" ]; then
          echo "$baked_bin" >> "$GITHUB_PATH"
          echo "use_system=true" >> "$GITHUB_OUTPUT"
          echo "::notice::Using baked Node $("$baked_bin/node" --version) (npm $("$baked_bin/npm" --version))"
        elif [ -n "$want" ] && [ "$(node --version 2>/dev/null | sed -E 's/^v//; s/\..*$//')" = "$want" ]; then
          echo "use_system=true" >> "$GITHUB_OUTPUT"
          echo "::notice::Using baked Node $(node --version) (npm $(npm --version))"
        else
          have=$(node --version 2>/dev/null | sed -E 's/^v//; s/\..*$//')
          echo "use_system=false" >> "$GITHUB_OUTPUT"
          echo "::notice::Falling back to actions/setup-node (want '${want:-?}', baked '${have:-none}')"
        fi

    - name: Set up Node (actions/setup-node fallback)
      if: steps.node-check.outputs.use_system != 'true'
      uses: actions/setup-node@v7
      with:
        node-version-file: ${{ inputs.node-version-file }}
        cache: 'npm'

    - name: Install dependencies
      shell: bash
      run: |
        if [ -f package-lock.json ]; then
          npm ci --prefer-offline --no-audit
        else
          npm install --no-audit
        fi

    - name: Build
      shell: bash
      run: |
        if [ -n "${{ inputs.build-script }}" ]; then
          echo "Running: npm run ${{ inputs.build-script }}"
          npm run ${{ inputs.build-script }}
        elif [ -f vite.config.js ] || [ -f vite.config.ts ]; then
          npm run build
        elif [ -f webpack.mix.js ]; then
          npm run prod
        else
          echo "::warning::Could not detect bundler (no vite.config.js, vite.config.ts, or webpack.mix.js). Skipping build step. Set the build-script input to suppress this warning."
        fi
