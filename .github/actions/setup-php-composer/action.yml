name: Set up PHP and Composer
description: Set up PHP, configure Composer authentication, cache dependencies, and install

inputs:
  php-version:
    description: PHP version
    required: true
  extensions:
    description: PHP extensions to install
    required: false
    default: 'mbstring, dom, fileinfo, mysql'
  coverage:
    description: Coverage driver
    required: false
    default: 'pcov'
  composer-oauth-token:
    description: GitHub OAuth token for Composer
    required: true
  flux-username:
    description: Flux Pro username
    required: false
  flux-password:
    description: Flux Pro password
    required: false
  composer-install-flags:
    description: 'Extra flags appended to `composer install` (e.g. "--no-scripts")'
    required: false
    default: ''

runs:
  using: composite
  steps:
    # Prefer a PHP version already baked into the runner image: if php${ver}
    # exists with all the requested extensions + coverage driver, shim it onto
    # PATH and skip shivammathur/setup-php (which reinstalls PHP from scratch,
    # ~45-55s). Falls back to setup-php whenever the baked image can't satisfy
    # the request, so this is safe for any caller/repo.
    - name: Check for usable baked PHP
      id: php-check
      shell: bash
      run: |
        set -uo pipefail
        want='${{ inputs.php-version }}'
        bin="/usr/bin/php${want}"
        use_system=true
        reason=""

        if [ ! -x "$bin" ]; then
          use_system=false
          reason="php${want} not baked into the image"
        else
          loaded=$("$bin" -m 2>/dev/null | tr '[:upper:]' '[:lower:]')
          is_loaded() { printf '%s\n' "$loaded" | grep -qx "$1"; }

          # setup-php extension aliases don't all match `php -m` module names.
          map_ext() {
            case "$1" in
              mysql) echo "pdo_mysql" ;;
              pgsql) echo "pdo_pgsql" ;;
              sqlite|sqlite3) echo "pdo_sqlite" ;;
              *) echo "$1" ;;
            esac
          }

          IFS=',' read -ra exts <<< "${{ inputs.extensions }}"
          for raw in "${exts[@]}"; do
            e=$(echo "$raw" | xargs | tr '[:upper:]' '[:lower:]')
            [ -z "$e" ] && continue
            m=$(map_ext "$e")
            if ! is_loaded "$m"; then
              use_system=false
              reason="missing extension: ${e} (${m})"
              break
            fi
          done

          cov='${{ inputs.coverage }}'
          if [ "$use_system" = true ] && [ -n "$cov" ] && [ "$cov" != "none" ]; then
            is_loaded "$cov" || { use_system=false; reason="missing coverage driver: ${cov}"; }
          fi
        fi

        if [ "$use_system" = true ]; then
          # Shim the requested version onto PATH for all later steps (composer,
          # artisan). GITHUB_PATH applies to subsequent steps, not this one.
          mkdir -p "$HOME/.local/bin"
          ln -sf "$bin" "$HOME/.local/bin/php"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          # The runner image ships pcov disabled by default (pcov.enabled=0) so
          # Rector isn't instrumented. When a coverage driver IS requested (test
          # jobs), re-enable it via an appended ini-scan dir — otherwise the test
          # runner exits non-zero on "No code coverage driver is available".
          if [ "$cov" = "pcov" ] || [ "$cov" = "xdebug" ]; then
            mkdir -p "$HOME/.php-ci-ini"
            echo "${cov}.enabled=1" > "$HOME/.php-ci-ini/zz-coverage.ini"
            echo "PHP_INI_SCAN_DIR=:$HOME/.php-ci-ini" >> "$GITHUB_ENV"
            echo "::notice::Enabled ${cov} for coverage via PHP_INI_SCAN_DIR"
          fi
          echo "::notice::Using baked PHP ${want} ($("$bin" -v | head -1))"
        else
          echo "::notice::Falling back to shivammathur/setup-php (${reason})"
        fi
        echo "use_system=$use_system" >> "$GITHUB_OUTPUT"

    - name: Set up PHP (setup-php fallback)
      if: steps.php-check.outputs.use_system != 'true'
      uses: shivammathur/setup-php@v2
      with:
        php-version: ${{ inputs.php-version }}
        extensions: ${{ inputs.extensions }}
        coverage: ${{ inputs.coverage }}
        tools: composer

    - name: Get Composer cache directory
      id: composer-cache
      shell: bash
      run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

    # On the ARC runners COMPOSER_CACHE_DIR already points at the shared FSx
    # mount, so actions/cache would only re-download a tarball onto a directory
    # that is persistent anyway. Use the mount for a vendor/ tarball instead:
    # one extract replaces 200+ per-package archive extractions on every job.
    - name: Restore vendor from the shared runner cache
      id: vendor-cache
      shell: bash
      run: |
        set -uo pipefail
        if [ -z "${COMPOSER_CACHE_DIR:-}" ] || [ ! -d "${COMPOSER_CACHE_DIR}" ]; then
          echo "shared=false" >> "$GITHUB_OUTPUT"
          exit 0
        fi
        tarball="${COMPOSER_CACHE_DIR}/vendor/${GITHUB_REPOSITORY//\//_}-php${{ inputs.php-version }}-${{ hashFiles('**/composer.lock') }}.tar"
        echo "shared=true" >> "$GITHUB_OUTPUT"
        echo "tarball=$tarball" >> "$GITHUB_OUTPUT"
        if [ -f "$tarball" ] && tar -xf "$tarball"; then
          echo "hit=true" >> "$GITHUB_OUTPUT"
          echo "::notice::Restored vendor/ from $tarball"
        else
          rm -rf vendor
          echo "hit=false" >> "$GITHUB_OUTPUT"
        fi

    - name: Cache dependencies
      if: steps.vendor-cache.outputs.shared != 'true'
      uses: actions/cache@v6
      with:
        path: ${{ steps.composer-cache.outputs.dir }}
        key: ${{ runner.os }}-php${{ inputs.php-version }}-composer-${{ hashFiles('**/composer.lock') }}
        restore-keys: |
          ${{ runner.os }}-php${{ inputs.php-version }}-composer-
          ${{ runner.os }}-composer-
        enableCrossOsArchive: true

    - name: Install dependencies
      shell: bash
      run: |
        composer config -g github-oauth.github.com ${{ inputs.composer-oauth-token }}
        if [ -n "${{ inputs.flux-username }}" ]; then
          composer config http-basic.composer.fluxui.dev "${{ inputs.flux-username }}" "${{ inputs.flux-password }}"
        fi
        composer install --no-progress --prefer-dist --optimize-autoloader ${{ inputs.composer-install-flags }}

    - name: Save vendor to the shared runner cache
      if: steps.vendor-cache.outputs.shared == 'true' && steps.vendor-cache.outputs.hit != 'true'
      shell: bash
      run: |
        set -uo pipefail
        tarball='${{ steps.vendor-cache.outputs.tarball }}'
        mkdir -p "$(dirname "$tarball")"
        tar -cf "$tarball.$$" vendor && mv -f "$tarball.$$" "$tarball"
        find "$(dirname "$tarball")" -name '*.tar' -mtime +14 -delete
        echo "::notice::Saved vendor/ to $tarball"
