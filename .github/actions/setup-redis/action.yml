name: Set up Redis
description: Start Redis container

inputs:
  image:
    description: Docker image
    required: false
    default: 'valkey/valkey'
  version:
    description: Docker image version
    required: false
    default: 'alpine'
  container-name:
    description: Container name
    required: false
    default: 'redis-test'
  port:
    description: Port
    required: false
    default: '6379'
  wait:
    description: Wait for service to be ready before continuing
    required: false
    default: 'true'

runs:
  using: composite
  steps:
    - name: Start container
      shell: bash
      run: |
        if ! docker ps -a --format '{{.Names}}' | grep -qx '${{ inputs.container-name }}'; then
          docker run -d \
            --name ${{ inputs.container-name }} \
            -p ${{ inputs.port }}:6379 \
            --health-cmd="redis-cli ping" \
            --health-interval=10s \
            --health-timeout=5s \
            --health-retries=3 \
            ${{ inputs.image }}:${{ inputs.version }}
        fi

    - name: Wait for healthy status
      if: inputs.wait == 'true'
      shell: bash
      run: |
        echo "Waiting for Redis to be healthy..."
        timeout 60 sh -c 'until docker inspect --format="{{.State.Health.Status}}" ${{ inputs.container-name }} | grep -qx healthy; do sleep 2; done' || {
          echo "::error::Redis did not report healthy in time"
          docker inspect --format='{{json .State.Health}}' ${{ inputs.container-name }}
          docker logs ${{ inputs.container-name }} --tail 50
          exit 1
        }
